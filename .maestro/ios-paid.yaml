# Paid path: injected signed-in session -> PLAY NOW -> real $0.50 credits match -> results -> HOME
# ROLE FLIP (2026-07-21): the ROBOT is the CREATOR (bot joins its game) so this flow has the
# exact proven practice-flow shape: the 8s creator countdown absorbs waitForAnimationToEnd and
# the answer taps land at question start with the full 10s window. Run 8 (robot as joiner)
# timed out: question appeared instantly, the 9s wait ate the window, and the late grid taps
# hit PLAY AGAIN on the results screen (stray requeued open game).
# NOTE: Maestro visible: strings are FULL-MATCH regexes. Always escape $ (unescaped = end-anchor,
# matches nothing — burned runs 6+7). Stake pill text is "$0.50 · WIN $0.95", so trail with .*
# NOTE: outcome regex must NOT include PLAY AGAIN — the post-answer waiting screen has that
# button too, and matching it there would leave before the real result arrives.
appId: com.dogmomhq.sensemobile
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "PLAY NOW"
    timeout: 45000
- extendedWaitUntil:
    visible: '\$\d+\.\d\d'
    timeout: 20000
- takeScreenshot: shots/paid-01-home
- tapOn: "PLAY NOW"
# stake pill on the countdown screen ("$0.50 · WIN $0.95")
- extendedWaitUntil:
    visible: '\$0\.50.*'
    timeout: 30000
- takeScreenshot: shots/paid-02-countdown
- waitForAnimationToEnd:
    timeout: 9000
- takeScreenshot: shots/paid-03-question
# 2x2 answer grid in the bottom fade — tap all four cells; first hit locks, rest ignored
- tapOn:
    point: "30%,75%"
- tapOn:
    point: "70%,75%"
- tapOn:
    point: "30%,84%"
- tapOn:
    point: "70%,84%"
# after locking, the app sits on the waiting screen until the harness bot's answer settles
# the match (~10-20s), then auto-advances to results
- extendedWaitUntil:
    visible: "YOU WIN|SO CLOSE|YOU LOST|DEAD HEAT"
    timeout: 120000
- takeScreenshot: shots/paid-04-outcome
- tapOn: "HOME"
- extendedWaitUntil:
    visible: "PLAY NOW"
    timeout: 15000
- takeScreenshot: shots/paid-05-home
