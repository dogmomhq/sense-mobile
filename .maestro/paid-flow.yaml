appId: com.dogmomhq.sensemobile
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: paid-shots/00_launch
- extendedWaitUntil:
    visible: "SENSE"
    timeout: 15000
- takeScreenshot: paid-shots/01_home
- tapOn:
    text: "\\$0.50"
- takeScreenshot: paid-shots/01b_stake_selected
- tapOn:
    text: "PLAY FOR.*"
- takeScreenshot: paid-shots/02_confirm
- tapOn:
    text: "CONFIRM & PLAY"
- takeScreenshot: paid-shots/03_finding
- extendedWaitUntil:
    visible: "What animal is this?"
    timeout: 40000
- takeScreenshot: paid-shots/04_question
- tapOn:
    point: "50%,70%"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: paid-shots/05_result
