# Happy path: home -> PRACTICE FREE -> countdown -> question -> answer -> results -> HOME
appId: com.dogmomhq.sensemobile
---
# stopApp:false (2026-09-09): keep the process that just passed the network-readiness probe. A cold
# relaunch on the runner can hit the simulator TLS stall (run 191: home rendered, tap did nothing,
# app.log = handshake loop) and read as an app failure.
- launchApp:
    clearState: false
    stopApp: false
- extendedWaitUntil:
    visible: "PRACTICE FREE"
    timeout: 45000
- takeScreenshot: shots/01-home
- tapOn: "PRACTICE FREE"
# 2026-09-19 (five red runs, all watched): every Maestro command costs 1-3 s on the GitHub Mac while the clip plays,
# so ANY assert/wait between the PRACTICE tap and the answer tap runs the 10.4-s round out. Tap the second answer
# row (30%,94%) six times with nothing in between: on a fast runner the later taps land after the 2.4-s countdown,
# on a slow one the early taps do; the grid locks on the first hit and ignores the rest. 94% is empty on the
# results screen (HOME ends ~92%), so a late tap can't navigate away.
- tapOn:
    point: "30%,94%"
- tapOn:
    point: "30%,94%"
- tapOn:
    point: "30%,94%"
- tapOn:
    point: "30%,94%"
- tapOn:
    point: "30%,94%"
- tapOn:
    point: "30%,94%"
- extendedWaitUntil:
    visible: "PLAY AGAIN"
    timeout: 40000
- takeScreenshot: shots/04-results
# an unanswered round is a FAILED gate, not a pass: the practice rival never times out, so this text means WE did.
# Results animate in over ~2 s — give the table time to draw before asserting.
- extendedWaitUntil:
    visible: "CORRECT ANSWER"
    timeout: 8000
- assertNotVisible: "TIMED OUT"

- tapOn: "HOME"
- extendedWaitUntil:
    visible: "PRACTICE FREE"
    timeout: 15000
- takeScreenshot: shots/05-back-home
