appId: com.dogmomhq.sensemobile
---
- launchApp
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: maestro-shots/00_launch
- runFlow:
    when:
      visible: "SENSE"
    commands:
      - takeScreenshot: maestro-shots/01_home
      - tapOn: "Profile"
      - takeScreenshot: maestro-shots/07_profile
      - tapOn: "Play"
      - tapOn: "Practice vs computer"
      - extendedWaitUntil:
          visible: "What animal is this?"
          timeout: 12000
      - takeScreenshot: maestro-shots/02_play
