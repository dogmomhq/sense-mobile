appId: com.dogmomhq.sensemobile
---
- launchApp
- assertVisible: "SENSE"
- takeScreenshot: maestro-shots/01_home
- tapOn: "Profile"
- assertVisible: "Online Stats"
- takeScreenshot: maestro-shots/07_profile
