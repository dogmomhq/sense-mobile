appId: com.dogmomhq.sensemobile
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: paid-shots/00_launch
- extendedWaitUntil:
    visible: "SENSE"
    timeout: 15000
- takeScreenshot: paid-shots/01_home
- tapOn:
    text: "\\$0.50"
- tapOn:
    text: "PLAY FOR.*"
- takeScreenshot: paid-shots/02_confirm
- tapOn:
    text: "CONFIRM & PLAY"
- takeScreenshot: paid-shots/03_finding
- extendedWaitUntil:
    visible: "WrongA"
    timeout: 40000
- takeScreenshot: paid-shots/04_question
# Wait out the 3-2-1 countdown overlay (~2.4s) that covers the answer buttons.
# Without this, the tap lands on the overlay, the app never answers, and it times out -> draw.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "WrongA"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    text: "WrongA"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: paid-shots/05_result
