appId: com.dogmomhq.sensemobile
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: paid-shots/00_launch
- extendedWaitUntil:
    visible: "SENSE"
    timeout: 15000
- takeScreenshot: paid-shots/01_home
- tapOn:
    text: "\\$0.50"
- tapOn:
    text: "PLAY FOR.*"
- takeScreenshot: paid-shots/02_confirm
- tapOn:
    text: "CONFIRM & PLAY"
- takeScreenshot: paid-shots/03_finding
- extendedWaitUntil:
    visible: "WrongA"
    timeout: 40000
- takeScreenshot: paid-shots/04_question
# The 3-2-1 countdown overlay (zIndex 200, absoluteFill) eats taps for ~2.5s.
# waitForAnimationToEnd returns early (the timer ring animates forever), so it is NOT a
# reliable sleep. Instead spray GUARDED taps across the window: each tap only fires when
# "WrongA" is visible, so once the overlay clears a tap lands and submits the answer.
- repeat:
    times: 14
    commands:
      - runFlow:
          when:
            visible: "WrongA"
          commands:
            - tapOn:
                text: "WrongA"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: paid-shots/05_result
