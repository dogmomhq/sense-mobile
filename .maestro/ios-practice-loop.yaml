appId: com.dogmomhq.sensemobile
---
- launchApp:
    clearState: false
- repeat:
    times: 5
    commands:
      - extendedWaitUntil:
          visible: "PRACTICE FREE"
          timeout: 45000
      - tapOn: "PRACTICE FREE"
      - extendedWaitUntil:
          visible: "PRACTICE · FREE"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "answer-0"
          timeout: 12000
      - repeat:
          times: 7
          commands:
            - tapOn:
                id: "answer-0"
            - waitForAnimationToEnd:
                timeout: 500
      - extendedWaitUntil:
          visible: "YOU WIN|SO CLOSE|YOU LOST|DEAD HEAT|TIMED OUT|DRAW|PLAY AGAIN|PLAY NOW"
          timeout: 40000
      - tapOn: "HOME"
- extendedWaitUntil:
    visible: "PRACTICE FREE"
    timeout: 20000
- takeScreenshot: shots/loop-done
