appId: com.dogmomhq.sensemobile
---
- launchApp:
    clearState: false
- repeat:
    times: 5
    commands:
      - extendedWaitUntil:
          visible: "PRACTICE FREE"
          timeout: 45000
      - tapOn: "PRACTICE FREE"
      - extendedWaitUntil:
          visible: "PRACTICE · FREE"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "countdown-opaque"
          timeout: 8000
      - extendedWaitUntil:
          notVisible:
            id: "countdown-opaque"
          timeout: 8000
      - extendedWaitUntil:
          visible:
            id: "answer-0"
          timeout: 4000
      - tapOn:
          id: "answer-0"
      - extendedWaitUntil:
          visible: "YOU WIN|SO CLOSE|YOU LOST|DEAD HEAT|TIMED OUT|DRAW|PLAY AGAIN|PLAY NOW"
          timeout: 40000
      - tapOn: "HOME"
- extendedWaitUntil:
    visible: "PRACTICE FREE"
    timeout: 20000
- takeScreenshot: shots/loop-done
