# Readiness probe (2026-09-07 v3): proves the SIMULATOR can reach the game server before the
# gate runs. Home mounts an invisible accessibility element with id "net-ready" ONLY after
# GET /api/tiers has answered from our server (ReskinApp serverOk). Nothing visible depends on
# it, and a guest account shows no balance on Home (v2's mistake), so this is the one honest
# server-derived signal available on a fresh install.
appId: com.dogmomhq.sensemobile
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "net-ready"
    timeout: 45000
