appId: com.dogmomhq.sensemobile
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: paid-shots/00_launch
- extendedWaitUntil:
    visible: "SENSE"
    timeout: 15000
- takeScreenshot: paid-shots/01_home
- tapOn:
    text: "\\$0.50"
- tapOn:
    text: "PLAY FOR.*"
- takeScreenshot: paid-shots/02_confirm
- tapOn:
    text: "CONFIRM & PLAY"
- takeScreenshot: paid-shots/03_finding
- extendedWaitUntil:
    visible: "Correct"
    timeout: 40000
- takeScreenshot: paid-shots/04_question
# 2.4s countdown overlay eats early taps. Spread taps from ~3s..~6s after the question:
# whichever lands first AFTER the countdown submits; the rest are no-ops (button disables).
# All land well inside the server's 13s answer window.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Correct"
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    text: "Correct"
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    text: "Correct"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: paid-shots/05_result
