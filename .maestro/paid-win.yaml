appId: com.dogmomhq.sensemobile
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: paid-shots/00_launch
- extendedWaitUntil:
    visible: "SENSE"
    timeout: 15000
- takeScreenshot: paid-shots/01_home
- tapOn:
    text: "\\$0.50"
- tapOn:
    text: "PLAY FOR.*"
- takeScreenshot: paid-shots/02_confirm
- tapOn:
    text: "CONFIRM & PLAY"
- takeScreenshot: paid-shots/03_finding
# Test build skips the 3-2-1 countdown, so the answer button is live immediately.
- extendedWaitUntil:
    visible: "Correct"
    timeout: 40000
- takeScreenshot: paid-shots/04_question
- tapOn:
    text: "Correct"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Correct"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: paid-shots/05_result
