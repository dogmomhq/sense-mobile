name: asc-profile3
on: workflow_dispatch
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - run: pip install pyjwt cryptography requests
      - env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          python3 - <<'PY'
          import jwt, time, base64, os, requests, json
          key = base64.b64decode(os.environ['ASC_KEY']).decode()
          tok = jwt.encode({'iss':'b26d5075-81df-418d-93b6-a3dd7be13e0c','iat':int(time.time()),'exp':int(time.time())+1200,'aud':'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid':'47N638GLZG'})
          H = {'Authorization':'Bearer '+tok}
          B = 'https://api.appstoreconnect.apple.com/v1'
          r = requests.delete(f'{B}/profiles/KY2F6339AY', headers=H); print('delete P2:', r.status_code)
          payload = {'data':{'type':'profiles','attributes':{'name':'Sense Mobile App Store P3','profileType':'IOS_APP_STORE'},'relationships':{'bundleId':{'data':{'type':'bundleIds','id':'CXXFQ36C88'}},'certificates':{'data':[{'type':'certificates','id':'PGRAQU29BN'}]}}}}
          r = requests.post(f'{B}/profiles', headers={**H,'Content-Type':'application/json'}, json=payload)
          print('create P3:', r.status_code)
          j = r.json()
          if r.status_code != 201:
              print(json.dumps(j)[:2000]); raise SystemExit(1)
          print('P3 id:', j['data']['id'])
          content = j['data']['attributes']['profileContent']
          for i in range(0, len(content), 200): print('PB64:' + content[i:i+200])
          PY
