name: EAS Build iOS (TestFlight)

# Builds the signed iOS .ipa on EAS (cloud, no Mac). Signing uses LOCAL credentials
# (self-generated dist cert + App Store provisioning profile) restored from repo secrets.
# Submission is a separate workflow (eas-submit-ios.yml) run after the app record exists.
on:
  workflow_dispatch: {}

jobs:
  ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps (needed for iOS config/entitlement resolution)
        run: npm ci || npm install
      - name: Restore iOS signing credentials (local)
        run: |
          mkdir -p ios_certs
          printf '%s' "${{ secrets.IOS_DIST_P12_BASE64 }}" | base64 -d > ios_certs/dist.p12
          printf '%s' "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 -d > ios_certs/sense.mobileprovision
          cat > credentials.json <<JSON
          {
            "ios": {
              "provisioningProfilePath": "ios_certs/sense.mobileprovision",
              "distributionCertificate": {
                "path": "ios_certs/dist.p12",
                "password": "${{ secrets.IOS_DIST_P12_PASSWORD }}"
              }
            }
          }
          JSON
      - name: Build iOS (.ipa)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build -p ios --profile testflight --non-interactive
