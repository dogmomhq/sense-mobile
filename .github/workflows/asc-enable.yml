name: ASC Enable Caps + New Profile

# TEMP (Package 2): enables APP_ATTEST + PUSH_NOTIFICATIONS on the bundle ID
# (CXXFQ36C88 / com.dogmomhq.sensemobile) and creates a fresh App Store
# provisioning profile including them (cert PGRAQU29BN). Prints the new
# profile base64 so the IOS_PROVISION_BASE64 repo secret can be updated.
# Delete after Package 2 ships.
on:
  workflow_dispatch: {}

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - run: pip install pyjwt cryptography requests
      - env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          python3 - <<'PY'
          import jwt, time, base64, os, requests, json
          key = base64.b64decode(os.environ['ASC_KEY']).decode()
          tok = jwt.encode({'iss':'b26d5075-81df-418d-93b6-a3dd7be13e0c','iat':int(time.time()),'exp':int(time.time())+1200,'aud':'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid':'47N638GLZG'})
          H = {'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'}
          A = 'https://api.appstoreconnect.apple.com/v1'
          BID = 'CXXFQ36C88'
          for cap in ['APP_ATTEST', 'PUSH_NOTIFICATIONS']:
              body = {'data': {'type': 'bundleIdCapabilities', 'attributes': {'capabilityType': cap},
                      'relationships': {'bundleId': {'data': {'type': 'bundleIds', 'id': BID}}}}}
              r = requests.post(f'{A}/bundleIdCapabilities', headers=H, json=body)
              print('ENABLE', cap, r.status_code, r.text[:300])
          # fresh profile including the new capabilities
          body = {'data': {'type': 'profiles',
                  'attributes': {'name': 'Sense Mobile App Store P2', 'profileType': 'IOS_APP_STORE'},
                  'relationships': {
                    'bundleId': {'data': {'type': 'bundleIds', 'id': BID}},
                    'certificates': {'data': [{'type': 'certificates', 'id': 'PGRAQU29BN'}]}}}}
          r = requests.post(f'{A}/profiles', headers=H, json=body)
          print('PROFILE_CREATE', r.status_code)
          d = r.json()
          if r.status_code == 201:
              content = d['data']['attributes']['profileContent']
              print('PROFILE_ID:', d['data']['id'])
              for i in range(0, len(content), 200):
                  print('PB64:' + content[i:i+200])
          else:
              print(json.dumps(d)[:2000])
          PY
