name: TestFlight Feedback (fetch)
on: { workflow_dispatch: {} }
jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: printf '%s' "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 -d > asc_key.p8
      - run: |
          npm i jsonwebtoken --no-save --silent
          node -e '
          const jwt=require("jsonwebtoken"),fs=require("fs");
          const key=fs.readFileSync("asc_key.p8");
          const tok=jwt.sign({},key,{algorithm:"ES256",expiresIn:"10m",issuer:"b26d5075-81df-418d-93b6-a3dd7be13e0c",audience:"appstoreconnect-v1",header:{alg:"ES256",kid:"47N638GLZG",typ:"JWT"}});
          const H={Authorization:"Bearer "+tok};
          const get=async(p)=>{const r=await fetch("https://api.appstoreconnect.apple.com"+p,{headers:H});let j;try{j=await r.json()}catch(e){j={}};return{s:r.status,j};};
          (async()=>{
            const b=await get("/v1/builds?filter[app]=6775628110&limit=3&sort=-uploadedDate");
            for(const bd of (b.j.data||[])){
              const id=bd.id, v=bd.attributes.version;
              for(const ep of ["betaFeedbackScreenshotSubmissions","betaFeedbackCrashSubmissions"]){
                const f=await get("/v1/builds/"+id+"/"+ep+"?limit=50");
                console.log("build "+v+" / "+ep+" -> HTTP "+f.s+" count="+((f.j.data||[]).length));
                if(f.j.errors)console.log("   ERR "+JSON.stringify(f.j.errors[0].detail||f.j.errors[0]));
                (f.j.data||[]).forEach(d=>{const a=d.attributes||{};console.log("   *",a.createdDate,"|",a.deviceModel||"","|",(a.comment||a.feedbackText||"(crash)").toString().slice(0,140));});
              }
            }
          })();
          '
