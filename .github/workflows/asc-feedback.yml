name: TestFlight Feedback (fetch)
on:
  workflow_dispatch: {}
jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Restore ASC API key
        run: printf '%s' "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 -d > asc_key.p8
      - name: Fetch TestFlight feedback
        run: |
          npm i jsonwebtoken --no-save --silent
          node -e '
          const jwt=require("jsonwebtoken"),fs=require("fs");
          const key=fs.readFileSync("asc_key.p8");
          const KID="47N638GLZG", ISS="b26d5075-81df-418d-93b6-a3dd7be13e0c", APP="6775628110";
          const tok=jwt.sign({},key,{algorithm:"ES256",expiresIn:"10m",issuer:ISS,audience:"appstoreconnect-v1",header:{alg:"ES256",kid:KID,typ:"JWT"}});
          const H={Authorization:"Bearer "+tok};
          (async()=>{
            for(const ep of ["betaFeedbackScreenshotSubmissions","betaFeedbackCrashSubmissions"]){
              try{
                const r=await fetch("https://api.appstoreconnect.apple.com/v1/apps/"+APP+"/"+ep+"?limit=50",{headers:H});
                const j=await r.json();
                console.log("\n===== "+ep+" (HTTP "+r.status+") =====");
                if(j.errors){console.log(JSON.stringify(j.errors));continue;}
                const data=j.data||[];
                console.log("COUNT:",data.length);
                for(const d of data){const a=d.attributes||{};console.log("-",a.createdDate,"|",(a.deviceModel||""),(a.osVersion||""),"|",(a.comment||a.feedbackText||"(no text)"));}
              }catch(e){console.log(ep,"ERROR",e.message);}
            }
          })();
          '
