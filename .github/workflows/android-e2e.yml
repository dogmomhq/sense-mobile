name: Android E2E (Maestro)

# Builds the REAL native app, runs it on an Android emulator, and drives it with Maestro,
# committing screenshots back so Claude can SEE the true native render (Hermes engine = same as
# the iPhone's JS engine). This catches the class of bug (e.g. the supabase white-screen) that the
# react-native-web Playwright pipeline can't. Skia is intentionally omitted on the first pass — the
# app falls back gracefully when it's absent — to avoid the heaviest native build until the pipeline is green.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS deps
        run: |
          npm install --no-audit --no-fund
          npx expo install react-native-svg expo-linear-gradient expo-haptics expo-font @react-native-async-storage/async-storage @expo-google-fonts/inter

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK (emulator arch only)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator + Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p maestro-shots
            "$HOME/.maestro/bin/maestro" test .maestro/flow.yaml || echo "maestro flow had failures"
            cp -r "$HOME"/.maestro/tests/*/ maestro-shots/debug 2>/dev/null || true
            ls -la maestro-shots maestro-shots/debug 2>/dev/null || true

      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "android-e2e-bot"
          git config user.email "e2e@dogmom.com"
          rm -rf android  # don't commit the generated native project
          git add maestro-shots || true
          git commit -m "Android E2E screenshots [skip ci]" || echo "no changes"
          git push || echo "push skipped"
