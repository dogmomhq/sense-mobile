name: Device Test (Maestro on EAS APK)

# Fast device test: DOWNLOAD the latest EAS-built Android APK (no local gradle build = no 15-min wait),
# install it on an emulator (AVD snapshot cached for fast boot), drive it with Maestro, commit screenshots.
# After EAS Update (OTA) is wired, JS changes won't even need a new APK — this just re-runs against the
# same build with the latest bundle.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download latest EAS Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          URL=$(npx --yes eas-cli@latest build:list --platform android --status finished --limit 1 --json --non-interactive \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const b=JSON.parse(s);process.stdout.write((b[0]&&b[0].artifacts&&b[0].artifacts.applicationArchiveUrl)||'')})")
          echo "Latest APK: $URL"
          test -n "$URL" || { echo "No finished APK yet"; exit 1; }
          curl -L "$URL" -o app.apk
          ls -la app.apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-pixel6

      - name: Create AVD snapshot (only if not cached)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load
          disable-animations: true
          script: echo "AVD snapshot created"

      - name: Run app + Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load
          disable-animations: true
          script: |
            adb install -r app.apk
            mkdir -p maestro-shots
            "$HOME/.maestro/bin/maestro" test .maestro/flow.yaml || echo "maestro flow had failures"
            cp -r "$HOME"/.maestro/tests/*/ maestro-shots/debug 2>/dev/null || true
            ls -la maestro-shots 2>/dev/null || true

      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "device-test-bot"
          git config user.email "e2e@dogmom.com"
          git add maestro-shots || true
          git commit -m "Device test screenshots [skip ci]" || echo "no changes"
          git push || echo "push skipped"
