name: Reskin OTA (preview channel)

# Ships the reskin-ui JS bundle over-the-air to the installed PREVIEW build in
# seconds (no native rebuild). The preview EAS build listens on channel
# "preview"; EAS Update maps channel -> branch, so we publish to branch
# "preview". Always run this with the workflow ref set to reskin-ui so the
# bundle is built from the reskin source, not main.
on:
  workflow_dispatch:
    inputs:
      message: { description: "Update message", required: false, default: "reskin OTA" }

permissions:
  actions: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci || npm install
      - name: Publish OTA update (channel/branch preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest update --branch preview --message "${{ github.event.inputs.message }}" --non-interactive
      - name: Kick E2E (practice-only) against the fresh OTA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-maestro-e2e.yml/dispatches" \
            -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d '{"ref":"reskin-ui","inputs":{"run_paid":"false"}}' && echo "e2e dispatched"
