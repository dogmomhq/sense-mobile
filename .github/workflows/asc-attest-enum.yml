name: ASC Attest Enum Probe

# TEMP: prints the full valid capabilityType enum from the APP_ATTEST 409 error.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install pyjwt cryptography requests
      - env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          python3 - <<'PY'
          import jwt, time, base64, os, requests
          key = base64.b64decode(os.environ['ASC_KEY']).decode()
          tok = jwt.encode({'iss':'b26d5075-81df-418d-93b6-a3dd7be13e0c','iat':int(time.time()),'exp':int(time.time())+1200,'aud':'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid':'47N638GLZG'})
          H = {'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'}
          body = {'data': {'type': 'bundleIdCapabilities', 'attributes': {'capabilityType': 'APP_ATTEST'},
                  'relationships': {'bundleId': {'data': {'type': 'bundleIds', 'id': 'CXXFQ36C88'}}}}}
          r = requests.post('https://api.appstoreconnect.apple.com/v1/bundleIdCapabilities', headers=H, json=body)
          print('FULL:', r.text)
          PY
