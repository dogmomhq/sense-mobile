name: Reskin TestFlight (build + submit from reskin-ui)

# Builds the reskin-ui branch as a signed iOS .ipa on EAS and submits it to TestFlight.
# Workflow file lives on main (workflow_dispatch requirement) but checks out reskin-ui;
# no app code on main is touched. Mirrors eas-build-ios.yml + eas-submit-ios.yml.
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Optional: existing EAS .ipa artifact URL — skips the build and submits this file'
        required: false
        default: ''

concurrency:
  group: reskin-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reskin-ui
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps
        run: npm ci || npm install
      - name: Restore iOS signing credentials (local)
        run: |
          mkdir -p ios_certs
          printf '%s' "${{ secrets.IOS_DIST_P12_BASE64 }}" | base64 -d > ios_certs/dist.p12
          printf '%s' "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 -d > ios_certs/sense.mobileprovision
          cat > credentials.json <<JSON
          {
            "ios": {
              "provisioningProfilePath": "ios_certs/sense.mobileprovision",
              "distributionCertificate": {
                "path": "ios_certs/dist.p12",
                "password": "${{ secrets.IOS_DIST_P12_PASSWORD }}"
              }
            }
          }
          JSON
      - name: Build iOS (.ipa) on EAS (waits for completion)
        if: github.event.inputs.ipa_url == ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest build -p ios --profile testflight --non-interactive --json > /tmp/build.json
          jq -r '.[0].id' /tmp/build.json > /tmp/build_id
          echo "built id: $(cat /tmp/build_id)"
      - name: Restore ASC API key
        run: printf '%s' "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 -d > asc_key.p8
      - name: Submit iOS build to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # NEVER --latest: a parallel simulator build can become "latest" (tar.gz -> submit fails).
        run: |
          if [ -n "${{ github.event.inputs.ipa_url }}" ]; then
            curl -fsSL -o /tmp/app.ipa "${{ github.event.inputs.ipa_url }}"
            npx --yes eas-cli@latest submit -p ios --profile testflight --path /tmp/app.ipa --non-interactive
          else
            npx --yes eas-cli@latest submit -p ios --profile testflight --id "$(cat /tmp/build_id)" --non-interactive
          fi
