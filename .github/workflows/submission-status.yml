name: Submission Status (debug)
on:
  push:
    paths:
      - .github/workflows/submission-status.yml
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: ASC API direct check
        env:
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          pip install --quiet pyjwt cryptography requests
          printf '%s' "$ASC_KEY_B64" | base64 -d > /tmp/asc_key.p8
          python3 - <<'PY'
          import jwt, time, requests, json
          key = open('/tmp/asc_key.p8').read()
          token = jwt.encode(
              {'iss':'b26d5075-81df-418d-93b6-a3dd7be13e0c','iat':int(time.time()),'exp':int(time.time())+900,'aud':'appstoreconnect-v1'},
              key, algorithm='ES256', headers={'kid':'47N638GLZG','typ':'JWT'})
          H = {'Authorization': f'Bearer {token}'}
          r = requests.get('https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.dogmomhq.sensemobile', headers=H)
          print('APPS:', r.status_code)
          if r.status_code != 200:
              print(json.dumps(r.json(), indent=1)[:2000]); raise SystemExit(0)
          app_id = r.json()['data'][0]['id']
          r2 = requests.get(f'https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app_id}&sort=-uploadedDate&limit=5', headers=H)
          print('BUILDS:', r2.status_code)
          for b in r2.json().get('data', []):
              a = b['attributes']
              print(' build', a.get('version'), a.get('processingState'), a.get('uploadedDate'))
          PY
