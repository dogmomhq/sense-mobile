name: Submission Status (debug)
on:
  push:
    paths:
      - .github/workflows/submission-status.yml
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch submission logs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for ID in b4aaf650-0f87-4fa6-869b-142c2d73741e 25a64215-af49-4c80-bcbb-f58e18bea1e5; do
            echo "=== submission $ID ==="
            RESP=$(curl -s https://api.expo.dev/graphql \
              -H "Authorization: Bearer $EXPO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"query{submissions{byId(submissionId:\\\"$ID\\\"){id status logsUrl error{errorCode message}}}}\"}")
            echo "$RESP"
            URL=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['submissions']['byId'].get('logsUrl') or '')" 2>/dev/null)
            if [ -n "$URL" ]; then
              echo "--- logs ---"
              curl -s "$URL" | tail -60
            fi
          done
