name: Submission Status (debug)
on:
  push:
    paths:
      - .github/workflows/submission-status.yml
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps
        run: npm ci || npm install
      - name: Restore ASC API key
        run: printf '%s' "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 -d > asc_key.p8
      - name: Re-submit with debug output
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_DEBUG: "1"
        run: npx --yes eas-cli@latest submit -p ios --profile testflight --latest --non-interactive 2>&1 | tail -80
