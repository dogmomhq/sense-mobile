name: ios-maestro-e2e
# NOTE: schedule runs execute MAIN's copy of this file (GitHub rule) but checkout
# pulls reskin-ui — keep the main copy identical to this one when editing.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "EAS simulator .tar.gz URL (blank = latest finished simulator build)"
        required: false
        default: ""
      run_paid:
        description: "Also run the paid $0.50 credits match (real ledger, auto-cleaned)"
        required: false
        default: "false"
  schedule:
    - cron: '0 9 * * *'   # 2am PT — quiet window; nightly always includes paid

permissions:
  contents: write

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reskin-ui

      - name: Resolve simulator build URL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          INPUT_URL: ${{ github.event.inputs.app_url }}
        run: |
          set -e
          if [ -n "$INPUT_URL" ]; then
            echo "APP_URL=$INPUT_URL" >> "$GITHUB_ENV"
          else
            npm install --no-audit --no-fund
            npx --yes eas-cli@latest build:list --platform ios --status finished --limit 20 --json --non-interactive > builds.json
            URL=$(jq -r '[.[] | select(.buildProfile=="simulator")][0].artifacts.applicationArchiveUrl // empty' builds.json)
            if [ -z "$URL" ]; then echo "NO FINISHED SIMULATOR BUILD"; jq -r '.[] | "\(.buildProfile) \(.status) \(.createdAt)"' builds.json | head; exit 1; fi
            echo "APP_URL=$URL" >> "$GITHUB_ENV"
            echo "using: $URL"
          fi

      - name: Download + unpack .app
        run: |
          set -e
          curl -sL "$APP_URL" -o app.tar.gz
          mkdir -p simapp && tar -xzf app.tar.gz -C simapp
          APP_PATH=$(find simapp -maxdepth 2 -name "*.app" | head -1)
          [ -n "$APP_PATH" ] || { echo "no .app in archive"; ls -laR simapp | head -50; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Boot simulator + install
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.isAvailable) | select(.name | test("^iPhone 1[5-9]"))] | last | .udid')
          [ -n "$UDID" ] && [ "$UDID" != "null" ] || { xcrun simctl list devices available; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          # OTA warm-up: launch #1 runs the EMBEDDED bundle and only downloads the
          # latest eas update in the background (expo-updates applies it on the NEXT
          # launch). Without this cycle every flow tests the stale embedded build —
          # caught 2026-07-27: validation run 19 was green on v.B60 while "validating"
          # the B61 OTA. 30s is ample for the few-MB bundle download.
          xcrun simctl launch "$UDID" com.dogmomhq.sensemobile
          sleep 30
          xcrun simctl terminate "$UDID" com.dogmomhq.sensemobile || true

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run E2E (practice + evil scenarios)
        run: |
          mkdir -p shots
          touch /tmp/e2e-start
          xcrun simctl io "$UDID" recordVideo --codec h264 -f shots/run.mp4 & echo $! > /tmp/vid.pid
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "sensemobile"' > shots/app.log 2>&1 & echo $! > /tmp/log.pid

          FAIL=0
          echo "=== flow 1: practice happy path ==="
          maestro test .maestro/ios-practice.yaml || FAIL=1

          echo "=== flow 2: kill mid-question, relaunch ==="
          maestro test -e TAG=kill .maestro/ios-enter-question.yaml || FAIL=1
          xcrun simctl terminate "$UDID" com.dogmomhq.sensemobile || true
          sleep 2
          xcrun simctl launch "$UDID" com.dogmomhq.sensemobile || true
          sleep 4
          maestro test -e TAG=kill .maestro/ios-alive-check.yaml || FAIL=1

          echo "=== flow 3: background mid-question, return ==="
          maestro test -e TAG=bg .maestro/ios-enter-question.yaml || FAIL=1
          xcrun simctl launch "$UDID" com.apple.Preferences || true
          sleep 6
          xcrun simctl launch "$UDID" com.dogmomhq.sensemobile || true
          sleep 4
          maestro test -e TAG=bg .maestro/ios-alive-check.yaml || FAIL=1

          echo "=== flow 4: 5-game loop ==="
          maestro test .maestro/ios-practice-loop.yaml || FAIL=1

          kill -INT $(cat /tmp/vid.pid) 2>/dev/null || true
          sleep 5
          kill $(cat /tmp/log.pid) 2>/dev/null || true
          # collect Maestro screenshots wherever they landed
          { find . -maxdepth 2 -name "*.png" -newer /tmp/e2e-start -not -path "./shots/*" -not -path "./node_modules/*" 2>/dev/null; find "$HOME/.maestro" -name "*.png" -newer /tmp/e2e-start 2>/dev/null; } | while read -r f; do cp -n "$f" shots/ 2>/dev/null || true; done
          ls -la shots/
          echo "VERDICT: $([ "$FAIL" = 0 ] && echo GREEN || echo RED)"
          exit $FAIL

      - name: Paid setup (accounts + seed + flag)
        if: github.event_name == 'schedule' || github.event.inputs.run_paid == 'true'
        env:
          SENSE_DB_URL: ${{ secrets.SENSE_DB_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          RUN_ID: ${{ github.run_number }}
        run: |
          set -e
          npm install --prefix e2e --no-audit --no-fund
          node e2e/paid-setup.mjs

      - name: Fresh install + inject robot session
        if: github.event_name == 'schedule' || github.event.inputs.run_paid == 'true'
        run: |
          set -e
          # fresh container purges the practice-era device account
          xcrun simctl terminate "$UDID" com.dogmomhq.sensemobile || true
          xcrun simctl uninstall "$UDID" com.dogmomhq.sensemobile
          xcrun simctl install "$UDID" "$APP_PATH"
          # OTA warm-up again — the fresh install wiped the downloaded update
          # (see boot step). Warm up BEFORE injecting the session so the robot's
          # first real launch runs the latest bundle.
          xcrun simctl launch "$UDID" com.dogmomhq.sensemobile
          sleep 30
          xcrun simctl terminate "$UDID" com.dogmomhq.sensemobile || true
          CONT=$(xcrun simctl get_app_container "$UDID" com.dogmomhq.sensemobile data)
          # @react-native-async-storage keeps its LIVE store under Library/Application
          # Support/<bundle>/RCTAsyncLocalStorage_V1 once the app has launched — NOT
          # Documents/. Pre-warm-up the inject worked because the app had never run
          # and first-init adopted the Documents seed. Post-warm-up (runs 20+21) the
          # Documents inject landed in a dead directory while the app read its live
          # AppSupport manifest → SIGN IN screen, bot exit 5, zero wagers. Fix: find
          # every store the warm-up created (plus the legacy Documents path) and
          # rebuild EACH as a virgin store = hashed session file + manifest pointing
          # the supabase key at it. expo-updates keeps the downloaded OTA elsewhere
          # (.expo-internal) — untouched by this.
          KEY="sb-nexpzwfemjcqdrljrfjy-auth-token"
          H=$(md5 -qs "$KEY")
          HANDLE=$(jq -r .robotHandle /tmp/e2e-ctx.json)
          { find "$CONT" -type d -name RCTAsyncLocalStorage_V1; echo "$CONT/Documents/RCTAsyncLocalStorage_V1"; } | sort -u | while IFS= read -r D; do
            [ -n "$D" ] || continue
            rm -rf "$D"
            mkdir -p "$D"
            cp /tmp/e2e-session.json "$D/$H"
            python3 -c "import json,os,sys; d,key,h=sys.argv[1],sys.argv[2],sys.argv[3]; json.dump({key: None, 'sense_balance': '300', 'sense_handle': h}, open(os.path.join(d,'manifest.json'),'w'))" "$D" "$KEY" "$HANDLE"
            echo "seeded store: $D"
          done
          echo "injected session, handle=$HANDLE"

      - name: Paid queue gate (no real players waiting)
        if: github.event_name == 'schedule' || github.event.inputs.run_paid == 'true'
        env:
          SENSE_DB_URL: ${{ secrets.SENSE_DB_URL }}
        run: node e2e/paid-precheck.mjs   # exit 5 = QUEUE-BUSY, aborts before any wager

      - name: Paid match (bot vs robot, real $0.50 x2 — runback scenario)
        if: github.event_name == 'schedule' || github.event.inputs.run_paid == 'true'
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SENSE_DB_URL: ${{ secrets.SENSE_DB_URL }}
          MATCHES: "2"           # B61: flow taps PLAY AGAIN at settle — bot must play the re-queued game too
        run: |
          mkdir -p shots
          xcrun simctl io "$UDID" recordVideo --codec h264 -f shots/paid.mp4 & echo $! > /tmp/pvid.pid
          # ROLE FLIP (post-run-8): the ROBOT creates the game (practice-flow timing);
          # the bot polls the DB and joins once the robot's open game is at the FIFO head.
          node e2e/paid-bot.mjs > shots/bot.log 2>&1 & echo $! > /tmp/bot.pid
          sleep 2
          PFAIL=0
          maestro test .maestro/ios-paid.yaml || PFAIL=1
          wait $(cat /tmp/bot.pid) || PFAIL=1
          kill -INT $(cat /tmp/pvid.pid) 2>/dev/null || true
          sleep 3
          { find . -maxdepth 2 -name "paid-*.png" -not -path "./shots/*" 2>/dev/null; find "$HOME/.maestro" -name "paid-*.png" 2>/dev/null; } | while read -r f; do cp -n "$f" shots/ 2>/dev/null || true; done
          echo "=== bot.log ==="; cat shots/bot.log
          exit $PFAIL

      - name: Paid assert (DB ground truth)
        # !cancelled(): run even when the Maestro step failed — the DB verdict
        # (settled? robot answered? strays?) is the diagnosis we need on RED
        # (run 9 skipped this step and hid the ground truth).
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event.inputs.run_paid == 'true') }}
        env:
          SENSE_DB_URL: ${{ secrets.SENSE_DB_URL }}
          EXPECT_MATCHES: "2"    # B61: both the first match AND the runback re-queue must settle; 1 settled + 1 orphan = the 2026-07-27 glitch
        run: node e2e/paid-assert.mjs

      - name: Paid cleanup (always)
        if: always() && (github.event_name == 'schedule' || github.event.inputs.run_paid == 'true')
        env:
          SENSE_DB_URL: ${{ secrets.SENSE_DB_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: node e2e/paid-cleanup.mjs

      - name: Alert CJ on RED
        if: failure()
        env:
          ADMIN_KEY: ${{ secrets.SENSE_ADMIN_KEY }}
        run: |
          curl -s -X POST "https://web-production-c6ec6.up.railway.app/api/admin/push/send" \
            -H "content-type: application/json" -H "x-admin-key: $ADMIN_KEY" \
            -d "{\"accountId\":\"d29a779f-e908-4786-9e61-2fdf90d6d2fa\",\"title\":\"E2E RED — ios run ${{ github.run_number }}\",\"body\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

      - name: Commit shots + video
        if: always()
        run: |
          DEST="maestro-shots/ios/run-${{ github.run_number }}"
          mkdir -p "$DEST"
          cp -R shots/* "$DEST"/ 2>/dev/null || true
          rm -f "$DEST"/*.mp4
          find "$DEST" -size +90M -delete 2>/dev/null || true
          git config user.name "sense-e2e-bot"
          git config user.email "e2e@sense.local"
          git add "$DEST"
          git commit -m "ios maestro e2e run ${{ github.run_number }}" || echo "nothing to commit"
          git pull --rebase origin reskin-ui || true
          git push origin HEAD:reskin-ui || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-run-${{ github.run_number }}
          path: shots

