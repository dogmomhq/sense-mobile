name: Daily digest
# CJ 2026-09-24: every morning — who played, anything that would have been "a bug CJ finds", anticheat rows, money,
# TestFlight feedback + Apple crash logs. Written to the `digests` branch and pushed to CJ's phone as one line.
on:
  schedule:
    - cron: '0 13 * * *'   # 09:00 New York (EDT)
  workflow_dispatch:
    inputs:
      hours: { description: 'Window in hours', default: '24' }
      push:  { description: 'Push the summary to CJ (1/0)', default: '1' }
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: reskin-ui, sparse-checkout: 'e2e', sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd e2e && npm install --no-audit --no-fund
      - name: Build digest
        env:
          SENSE_DB_URL: ${{ secrets.SENSE_DB_URL }}
          SENSE_ADMIN_KEY: ${{ secrets.SENSE_ADMIN_KEY }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          DIGEST_HOURS: ${{ github.event.inputs.hours || '24' }}
          DIGEST_PUSH: ${{ github.event.inputs.push || '1' }}
        run: cd e2e && node digest.mjs
      - name: Save to the digests branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node - <<'EOF'
          const fs = require('fs'); const H = { Authorization: 'Bearer ' + process.env.GH_TOKEN, 'Content-Type': 'application/json', 'User-Agent': 'digest' };
          const api = async (m, p, b) => { const r = await fetch('https://api.github.com' + p, { method: m, headers: H, body: b ? JSON.stringify(b) : undefined }); const j = await r.json().catch(() => ({})); return { ok: r.ok, status: r.status, j }; };
          (async () => {
            const repo = process.env.REPO;
            let ref = await api('GET', `/repos/${repo}/git/ref/heads/digests`);
            if (!ref.ok) { const main = await api('GET', `/repos/${repo}/git/ref/heads/main`); ref = await api('POST', `/repos/${repo}/git/refs`, { ref: 'refs/heads/digests', sha: main.j.object.sha }); console.log('created digests branch', ref.status); }
            for (const f of fs.readdirSync('e2e/digests')) {
              const path = `digests/${f}`; const cur = await api('GET', `/repos/${repo}/contents/${path}?ref=digests`);
              const body = { message: `digest ${f}`, content: fs.readFileSync('e2e/digests/' + f).toString('base64'), branch: 'digests' }; if (cur.ok) body.sha = cur.j.sha;
              const r = await api('PUT', `/repos/${repo}/contents/${path}`, body); console.log(path, r.status);
            }
          })();
          EOF
