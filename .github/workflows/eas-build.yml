name: EAS Build (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "preview"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps (required to resolve Expo config plugins, e.g. expo-font)
        run: npm install --no-audit --no-fund
      - name: Trigger EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build -p android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait
